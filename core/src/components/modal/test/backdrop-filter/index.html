<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Modal - Backdrop Filter</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
    <style>
      ion-content.stripes {
        --background: repeating-linear-gradient(90deg, #1f3b8c 0 8px, #ffffff 8px 16px);
      }

      ion-modal.glass-modal {
        --background: transparent;
        --box-shadow: none;
      }

      .glass-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .glass {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;

        width: 320px;
        height: 200px;

        border-radius: 16px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        color: #000;
        font-size: 20px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Modal - Backdrop Filter</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="stripes ion-padding">
        <ion-button id="open-modal">Open frosted glass modal</ion-button>

        <ion-modal trigger="open-modal" mode="md" class="glass-modal">
          <div class="glass-wrapper">
            <div class="glass" id="glass">
              <span>Frosted glass</span>
              <ion-button id="close-modal" fill="solid" color="dark">Close</ion-button>
            </div>
          </div>
        </ion-modal>
      </ion-content>
    </ion-app>

    <script>
      const modal = document.querySelector('ion-modal');
      document.querySelector('#close-modal').addEventListener('click', () => modal.dismiss());
    </script>
  </body>
</html>
